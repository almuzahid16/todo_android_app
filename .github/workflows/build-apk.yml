name: Build and Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build APK and Release
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '11'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.7.12'

      - name: Install Dependencies
        working-directory: ./flutter-todo-app-master
        run: flutter pub get

      - name: Build APK
        working-directory: ./flutter-todo-app-master
        run: flutter build apk --release

      - name: Upload Release
        uses: softprops/action-gh-release@v1
        with:
          files: flutter-todo-app-master/build/app/outputs/flutter-apk/app-release.apk
          tag_name: v1.0.0
          name: Release v1.0.0
          body: "Initial APK release for Flutter Todo App. Download and install on any Android device."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
